name: Windows portable release
on:
  push:
    branches: [main]
    paths: [app_version.py, .github/workflows/release.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: portable-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and test
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt pyinstaller==6.22.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify packaged update restart
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed --name FrozenRestartProbe --distpath build/frozen-restart-probe integration_frozen_restart.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Start-Process -FilePath 'build/frozen-restart-probe/FrozenRestartProbe.exe' -WindowStyle Hidden
          $probeDeadline = (Get-Date).AddSeconds(90)
          while (!(Test-Path 'build/frozen-restart-probe/probe-result.json') -and (Get-Date) -lt $probeDeadline) { Start-Sleep -Seconds 1 }
          $probeResult = Get-Content 'build/frozen-restart-probe/probe-result.json' -ErrorAction Stop | ConvertFrom-Json
          if (!$probeResult.fresh_runtime -or !$probeResult.runtime_exists) { throw 'Packaged restart failed.' }
      - name: Build portable EXE
        shell: pwsh
        run: |
          python collect_license_notices.py build/license-notices
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m PyInstaller --add-data "build/license-notices/LICENSE;." --add-data "build/license-notices/THIRD_PARTY_NOTICES;THIRD_PARTY_NOTICES" --noconfirm --onefile --windowed --name MeshCore-Configurator --collect-all meshcore --collect-all bleak --hidden-import serial.tools.list_ports_windows desktop_entry.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish immutable version assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $releaseVersion = python -c "from app_version import VERSION; print('v'+VERSION)"
          gh release view $releaseVersion *> $null
          if ($LASTEXITCODE -eq 0) { throw 'Version already published. Bump app_version.py instead of replacing it.' }
          New-Item -ItemType Directory -Path 'portable/MeshCore Configurator' -Force | Out-Null
          Copy-Item -LiteralPath 'dist/MeshCore-Configurator.exe' -Destination 'portable/MeshCore Configurator/! MeshCore Configurator.exe'
          Copy-Item -Path 'build/license-notices/*' -Destination 'portable/MeshCore Configurator' -Recurse -Force
          Compress-Archive -LiteralPath 'portable/MeshCore Configurator' -DestinationPath 'dist/MeshCore-Configurator-portable.zip'
          python release_notes.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release create $releaseVersion 'dist/MeshCore-Configurator.exe' 'dist/MeshCore-Configurator-portable.zip' --target $env:GITHUB_SHA --title "MeshCore Configurator $releaseVersion" --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
